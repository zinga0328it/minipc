table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        jump banned

        iif lo accept
        ct state established,related accept

        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        include "/etc/nftables/services/ssh.conf"
        include "/etc/nftables/services/yggdrasil.conf"
        include "/etc/nftables/services/tor.conf"
        include "/etc/nftables/services/apache2.conf"

        reject with icmp type port-unreachable
        reject with icmpv6 type port-unreachable
    }

    chain banned {
        include "/etc/nftables/services/banned.conf"
    }
}
