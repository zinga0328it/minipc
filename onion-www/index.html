<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Tor Test Page</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .box {
        background: #111827;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 2rem 3rem;
        text-align: center;
        box-shadow: 0 12px 30px rgba(0,0,0,.35);
      }
      h1 { margin-top: 0; }
      p { color: #cbd5e1; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Pagina test Tor</h1>
      <p>Se vedi questa pagina via .onion, il hidden service di Tor funziona.</p>
      <p>Apache locale: OK</p>
    </div>
  </body>
</html>
