[Definition]
# Nessun ban: registra solo i candidati. Il blocco su Cloudflare resta manuale (scripts/cf-block.sh).
# Un ban locale con nftables sarebbe inutile: dal tunnel il traffico arriva da 127.0.0.1.
actionstart = install -d -m 0750 /var/log/honeypot
actionstop =
actioncheck =
actionban = echo "$(date -Is) CANDIDATE ip=<ip> jail=<name> failures=<failures>" >> /var/log/honeypot/candidates.log
actionunban = echo "$(date -Is) EXPIRED ip=<ip> jail=<name>" >> /var/log/honeypot/candidates.log

[Init]
